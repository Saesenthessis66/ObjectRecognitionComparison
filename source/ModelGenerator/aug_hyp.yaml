# optimizer / learning
lr0: 0.001        # initial learning rate
lrf: 0.01         # final lr multiplier (cosine decay)
momentum: 0.9     # beta1 for Adam
weight_decay: 0.0005  # L2 regularization

# warmup
warmup_epochs: 3.0     # warmup duration
warmup_momentum: 0.8   # initial momentum during warmup
warmup_bias_lr: 0.1    # higher lr for bias at start

# loss gains
box: 0.08        # box regression weight (higher improves localization)
cls: 0.5         # classification weight
cls_pw: 1.0      # class positive weight
obj: 1.0         # objectness weight
obj_pw: 1.0      # objectness positive weight

# thresholds
iou_t: 0.20      # IoU threshold for positive anchors
anchor_t: 4.0    # anchor matching threshold
fl_gamma: 0.0    # focal loss gamma (disabled)

# augmentation
hsv_h: 0.01      # hue variation
hsv_s: 0.3       # saturation variation
hsv_v: 0.3       # brightness variation

degrees: 5.0     # small rotation
translate: 0.1   # random shift
scale: 0.2       # random zoom

shear: 0.0       # disabled (distorts geometry)
perspective: 0.0 # disabled (handled in renderer)

flipud: 0.0      # disabled (changes class)
fliplr: 0.0      # disabled (changes class)

mosaic: 0.0      # disabled (mixes objects)
mixup: 0.0       # disabled (blends objects)

copy_paste: 0.1  # duplicates objects without distortion